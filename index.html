<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="turn"></h1>
      <div class="board">
        <div class="modal">
          <form class="modal-form">
            <span>Entering nothing will default to Player 1 and Player 2</span>
            <label for="playerOne">Player One Name: </label>
            <input class="playerOne" type="text" name="playerOne" value="" />
            <label for="playerTwo">Player Two Name: </label>
            <input class="playerTwo" type="text" name="playerTwo" value="" />
            <button type="submit">Start Game</button>
          </form>
        </div>
      </div>
      <button class="reset hidden">Reset</button>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
